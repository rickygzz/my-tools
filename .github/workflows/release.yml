# Builds the My Tools packages for Windows, macOS and Linux, each on its own OS,
# by running `cargo xtask dist` on all three.
#
# - Push a tag like v0.1.0  -> builds all three and publishes a GitHub Release with them.
# - "Run workflow" button   -> builds all three; download them from the run's Artifacts.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 (older glibc) so the Linux binary also runs on older distros.
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux libraries (GTK, AppIndicator, xdo)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev

      - name: Build package
        run: cargo xtask dist

      - uses: actions/upload-artifact@v4
        with:
          name: my-tools-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" packages/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "My Tools $GITHUB_REF_NAME" \
            --generate-notes
