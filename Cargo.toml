[package]
name = "my-tools"
version = "0.1.0"
edition = "2024"

[dependencies]
winit = "0.30"

# Windows and macOS tray. On Linux it needs GTK and the deprecated libayatana-appindicator,
# so Linux uses ksni instead (below).
[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = "0.26.1"

[target.'cfg(target_os = "linux")'.dependencies]
# Linux tray: speaks the StatusNotifierItem D-Bus protocol directly, no GTK or C libraries.
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }
# D-Bus calls of our own (GNOME extension setup, notifications). Same version ksni uses.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
# Linux (X11) spotlight: keys via XInput2, click-through via XFixes. winit already uses x11rb.
x11rb = { version = "0.13", features = ["xinput", "xfixes", "shape"] }
# Linux (Wayland) spotlight: see-through pixel buffers on winit's own Wayland connection
# (softbuffer only offers opaque ones there). Same versions winit already uses.
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
memmap2 = "0.9"
rustix = { version = "1", features = ["fs"] }

[target."cfg(windows)".dependencies]
softbuffer = "0.4"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader"] }

# macOS spotlight: Rust bindings to Apple's frameworks. Same versions tray-icon/muda already use.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSGeometry"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSColor", "NSEvent", "NSGraphics", "NSResponder", "NSScreen", "NSView", "NSWindow", "objc2-quartz-core"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer", "CAShapeLayer", "CATransaction", "objc2-core-foundation", "objc2-core-graphics"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGAffineTransform", "CGColor", "CGEvent", "CGEventTypes", "CGPath"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes", "CFMachPort", "CFRunLoop"] }

[build-dependencies]
winresource = "0.1.34"

# The app plus its helper tool (`cargo xtask ...`), sharing one Cargo.lock and target folder.
[workspace]
members = ["xtask"]
