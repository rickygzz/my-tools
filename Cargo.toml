[package]
name = "my-tools"
version = "0.1.0"
edition = "2024"

[dependencies]
tray-icon = "0.26.1"
winit = "0.30"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[build-dependencies]
winresource = "0.1.34"

# The app plus its helper tool (`cargo xtask ...`), sharing one Cargo.lock and target folder.
[workspace]
members = ["xtask"]
